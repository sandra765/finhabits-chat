<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finhabits Soporte</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #075e54; color: white; padding: 16px 20px; font-size: 18px; font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 15px; white-space: pre-wrap; }
    .msg.user { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.agent { background: white; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg.typing { color: #999; font-style: italic; }
    .input-bar { display: flex; padding: 12px; background: #f0f2f5; gap: 8px; }
    .input-bar input { flex: 1; padding: 12px 16px; border-radius: 24px; border: none; font-size: 15px; outline: none; }
    .input-bar button { background: #075e54; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
    .input-bar button:disabled { background: #ccc; }
  </style>
</head>
<body>
  <div class="header">💬 Finhabits Soporte</div>
  <div class="messages" id="messages"></div>
  <div class="input-bar">
    <input id="input" placeholder="Escribe tu mensaje..." autocomplete="off" />
    <button id="send" onclick="sendMessage()">➤</button>
  </div>
  <script>
    const userId = crypto.randomUUID();
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      const typing = addMessage('Escribiendo...', 'agent typing');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, message: text }),
        });
        typing.remove();
        let agentBubble = null;
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.slice(6));
            if (data.text) {
              if (!agentBubble) { agentBubble = addMessage(data.text, 'agent'); }
              else { agentBubble.textContent += '\n' + data.text; }
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (data.done) break;
          }
        }
      } catch (err) {
        typing.remove();
        addMessage('Error de conexión. Intenta de nuevo.', 'agent');
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>
</body>
</html>
